[package]
name = "OpenAudio"
version = "0.1.0"
edition = "2021"

[dependencies]
audio-core = { path = "../../crates/audio-core" }
image = { version = "0.25", default-features = false, features = ["ico"] }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "OpenAudio"
identifier = "com.openaudio.sender"
icon = ["icon.ico"]
version = "0.1.0"
copyright = "Copyright (c) OpenAudio"
short_description = "Cross-platform Audio Over IP"

[features]
asio = ["audio-core/asio"]