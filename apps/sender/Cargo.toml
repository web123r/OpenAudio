[package]
name = "ferronme"
version = "0.1.0"
edition = "2021"

[dependencies]
audio-core = { path = "../../crates/audio-core" }
image = { version = "0.25", default-features = false, features = ["ico"] }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation" ,"Win32_System_Power"  ] }

[build-dependencies]
winresource = "0.1"