[package]
name = "openaudio-plugin"
version = "0.1.0"
edition = "2021"
description = "OpenAudio DAW Audio Plugin Bridge (VST3 / CLAP / AudioUnit)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
audio-core = { path = "../../crates/audio-core" }
network-core = { path = "../../crates/network-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
