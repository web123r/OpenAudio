[package]
name = "audio-core"
version = "0.1.0"
edition = "2021"
description = "OpenAudio audio engine: device enumeration, capture, and playback."

[lib]
name = "audio_core"
path = "src/lib.rs"

[features]
default = []
# Enable this feature when the Steinberg ASIO SDK is available on the build machine.
# Set the CPAL_ASIO_DIR environment variable to the SDK root before building:
#   $env:CPAL_ASIO_DIR = "C:\path\to\asio_sdk"
#   cargo build --features asio
asio = ["cpal/asio"]

[dependencies]
cpal = { version = "0.15", features = [] }
hound = "3.5"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.10"

[dependencies.windows]
version = "0.59"
features = [
    "Win32_System_Threading",
    "Win32_Foundation",
]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_System_Com"] }

