<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferronme's OpenAudio Web Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0f14 0%, #1a1a24 100%);
    color: #e8e8ec;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: rgba(30,30,40,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 2.5rem;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #444;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .dot.live {
    background: #34d399;
    box-shadow: 0 0 12px #34d399;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 1.8rem;
  }

  .hidden {
    display: none !important;
  }

  .access-panel {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 1rem;
  }

  .access-panel h2 {
    font-size: 1.05rem;
    margin-bottom: 0.45rem;
  }

  .access-panel p {
    color: #888;
    font-size: 0.8rem;
    line-height: 1.45;
    margin-bottom: 1rem;
  }

  .access-panel label {
    display: block;
    color: #aaa;
    font-size: 0.8rem;
    margin-bottom: 0.45rem;
  }

  .access-panel input {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 0.75rem;
    color: #fff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px;
    outline: none;
  }

  .access-panel input:focus {
    border-color: #6366f1;
  }

  #loginMessage {
    min-height: 1rem;
    margin-bottom: 0.7rem;
    color: #fca5a5;
    font-size: 0.78rem;
  }

  .top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  #accessMode {
    color: #a5b4fc;
    font-size: 0.75rem;
  }

  #logoutBtn {
    flex: none;
    width: auto;
    padding: 0.45rem 0.75rem;
    font-size: 0.72rem;
  }

  /* stream list */
  #streamList {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }

  .stream-card {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stream-card:hover {
    border-color: #6366f1;
    background: rgba(99,102,241,0.08);
  }

  .stream-card.selected {
    border-color: #6366f1;
    background: rgba(99,102,241,0.15);
  }

  .stream-card .name {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .stream-card .meta {
    font-size: 0.75rem;
    color: #888;
    margin-top: 0.2rem;
  }

  .stream-card .arrow {
    color: #6366f1;
    font-size: 1.1rem;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .stream-card:hover .arrow,
  .stream-card.selected .arrow {
    opacity: 1;
  }

  .empty {
    color: #666;
    font-size: 0.85rem;
    text-align: center;
    padding: 1.2rem;
  }

  /* channel picker */
  #channelSection {
    display: none;
    margin-bottom: 1.2rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 1rem;
  }

  #channelSection .sec-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #777;
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #channelSection .sec-title span {
    color: #a5b4fc;
    font-size: 0.7rem;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }

  #channelGrid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-bottom: 0.8rem;
  }

  .ch-btn {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }

  .ch-btn .ch-num {
    font-size: 0.8rem;
  }

  .ch-btn .ch-label {
    font-size: 0.55rem;
    color: #666;
  }

  .ch-btn.active {
    background: rgba(99,102,241,0.3);
    border-color: #6366f1;
    color: #fff;
  }

  .ch-btn.active .ch-label {
    color: #a5b4fc;
  }

  .ch-quick {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .ch-quick button {
    flex: none;
    padding: 0.3rem 0.7rem;
    font-size: 0.72rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #aaa;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }

  .ch-quick button:hover {
    background: rgba(99,102,241,0.2);
    color: #fff;
    border-color: #6366f1;
  }

  /* output mix mode */
  #mixRow {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.7rem;
    flex-wrap: wrap;
  }

  .mix-btn {
    flex: 1;
    min-width: 80px;
    padding: 0.35rem 0.5rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #aaa;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, color 0.15s;
  }

  .mix-btn.active {
    background: rgba(52,199,89,0.2);
    border-color: #34c759;
    color: #6ee7b7;
  }

  /* buttons */
  .btn-row {
    display: flex;
    gap: 0.7rem;
    margin-bottom: 0.5rem;
  }

  button {
    flex: 1;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 10px;
    padding: 0.8rem;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(99,102,241,0.35);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.secondary {
    background: linear-gradient(135deg, #374151, #1f2937);
  }

  button.warn-btn {
    background: linear-gradient(135deg, #f59e0b, #f97316);
  }

  /* now playing */
  .now-playing {
    margin-top: 1.2rem;
    padding: 1rem;
    border-radius: 14px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.06);
    display: none;
  }

  .np-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #777;
  }

  .np-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #a5b4fc;
    margin: 0.2rem 0 0.4rem;
  }

  .meta-row {
    display: flex;
    gap: 1rem;
    font-size: 0.78rem;
    color: #999;
    flex-wrap: wrap;
  }

  .meta-row b {
    color: #ddd;
  }

  .engine-badge {
    display: inline-block;
    padding: 0.1rem 0.45rem;
    border-radius: 6px;
    background: rgba(99,102,241,0.2);
    color: #a5b4fc;
    font-size: 0.67rem;
    font-weight: 600;
  }

  .ch-active-badge {
    display: inline-block;
    padding: 0.1rem 0.45rem;
    border-radius: 6px;
    background: rgba(52,199,89,0.2);
    color: #6ee7b7;
    font-size: 0.67rem;
    font-weight: 600;
  }

  /* status */
  #status {
    margin-top: 0.9rem;
    padding: 0.65rem 0.9rem;
    border-radius: 10px;
    font-size: 0.83rem;
  }

  .ok {
    background: rgba(52,211,153,0.15);
    color: #6ee7b7;
    border: 1px solid rgba(52,211,153,0.3);
  }

  .err {
    background: rgba(248,113,113,0.15);
    color: #fca5a5;
    border: 1px solid rgba(248,113,113,0.3);
  }

  .idle {
    background: rgba(255,255,255,0.05);
    color: #999;
  }

  .warn-st {
    background: rgba(245,158,11,0.15);
    color: #fcd34d;
    border: 1px solid rgba(245,158,11,0.3);
  }

  #stats {
    margin-top: 0.5rem;
    font-size: 0.71rem;
    color: #555;
    text-align: center;
  }

  #resumeBtn {
    display: none;
    width: 100%;
    margin-bottom: 0.5rem;
  }

  #resumeBtn.show {
    display: block;
  }

  @media (max-width: 540px) {
    body {
      align-items: flex-start;
      padding: 1rem;
    }

    .card {
      padding: 1.25rem;
    }
  }
</style>
</head>

<body>
<div class="card">
  <h1>
    <span id="liveDot" class="dot"></span>
    OpenAudio Web Player
  </h1>

  <div class="subtitle">Live streams on your network</div>

  <section id="loadingPanel" class="access-panel">
    Checking gateway access…
  </section>

  <section id="loginPanel" class="access-panel hidden">
    <h2>Password required</h2>

    <p>
      Enter the password configured by the OpenAudio host.
    </p>

    <div id="loginMessage"></div>

    <form id="loginForm">
      <label for="password">Gateway password</label>

      <input
        id="password"
        type="password"
        minlength="8"
        maxlength="256"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">
        Sign in
      </button>
    </form>
  </section>

  <section id="playerPanel" class="hidden">
    <div class="top-actions">
      <span id="accessMode"></span>

      <button
        id="logoutBtn"
        class="secondary hidden"
        type="button"
      >
        Log out
      </button>
    </div>

    <div id="streamList">
      <div class="empty">Loading streams…</div>
    </div>

    <div id="channelSection">
      <div class="sec-title">
        <span
          style="
            color:#e8e8ec;
            font-size:0.75rem;
            text-transform:uppercase;
            letter-spacing:0.05em;
          "
        >
          Channel Selection
        </span>

        <span id="chSelectAll">Select all</span>
      </div>

      <div id="channelGrid"></div>

      <div class="ch-quick">
        <button type="button" onclick="selectPairs('L')">
          L only
        </button>

        <button type="button" onclick="selectPairs('R')">
          R only
        </button>

        <button type="button" onclick="selectPairs('LR')">
          Stereo pairs
        </button>

        <button type="button" onclick="selectNone()">
          None
        </button>

        <button type="button" onclick="selectAll()">
          All
        </button>
      </div>

      <div id="mixRow">
        <div
          class="mix-btn active"
          data-mix="downmix"
          onclick="setMix(this)"
        >
          🔀 Downmix
        </div>

        <div
          class="mix-btn"
          data-mix="first2"
          onclick="setMix(this)"
        >
          1–2 only
        </div>

        <div
          class="mix-btn"
          data-mix="mono"
          onclick="setMix(this)"
        >
          Mono sum
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button
        id="refreshBtn"
        class="secondary"
        type="button"
      >
        ⟳ Refresh
      </button>

      <button
        id="playBtn"
        type="button"
        disabled
      >
        ▶ Play Selected
      </button>
    </div>

    <button
      id="resumeBtn"
      class="warn-btn"
      type="button"
    >
      🔊 Click to Enable Audio
    </button>

    <div id="nowPlaying" class="now-playing">
      <div class="np-label">Now Playing</div>
      <div class="np-name" id="npName">—</div>

      <div class="meta-row">
        <span>📡 <b id="npFormat">—</b></span>

        <span>
          ⚙️
          <span class="engine-badge" id="npEngine">
            —
          </span>
        </span>

        <span>
          🎚️
          <span class="ch-active-badge" id="npChannels">
            —
          </span>
        </span>
      </div>
    </div>

    <div id="status" class="idle">
      Select a stream above, then press Play.
    </div>

    <div id="stats"></div>
  </section>
</div>

<script>
  "use strict";

  const parsedPort = Number.parseInt(location.port, 10);
  const WS_PORT = Number.isInteger(parsedPort)
    ? parsedPort + 1
    : 7101;

  let protectedMode = false;
  let streams = [];
  let selectedNodeId = null;

  let ws = null;
  let audioCtx = null;
  let workletNode = null;
  let processorNode = null;
  let usingWorklet = false;

  let totalChannels = 2;
  let channelLabels = [];
  let sampleRate = 48000;
  let streamDisplayName = "";

  // Original channel-selection behavior.
  let activeChannels = new Set();
  let mixMode = "downmix";

  // Original fallback ring buffer.
  let ringCapacity = 0;
  let ringBuffers = [];
  let ringWrite = 0;
  let ringRead = 0;
  let ringAvailable = 0;
  let fallbackUnderruns = 0;

  const loadingPanel =
    document.getElementById("loadingPanel");
  const loginPanel =
    document.getElementById("loginPanel");
  const playerPanel =
    document.getElementById("playerPanel");
  const loginForm =
    document.getElementById("loginForm");
  const loginBtn =
    document.getElementById("loginBtn");
  const loginMessage =
    document.getElementById("loginMessage");
  const passwordInput =
    document.getElementById("password");
  const accessMode =
    document.getElementById("accessMode");
  const logoutBtn =
    document.getElementById("logoutBtn");

  const listEl =
    document.getElementById("streamList");
  const playBtn =
    document.getElementById("playBtn");
  const refreshBtn =
    document.getElementById("refreshBtn");
  const resumeBtn =
    document.getElementById("resumeBtn");
  const statusEl =
    document.getElementById("status");
  const statsEl =
    document.getElementById("stats");
  const liveDot =
    document.getElementById("liveDot");
  const nowPlaying =
    document.getElementById("nowPlaying");
  const chSection =
    document.getElementById("channelSection");
  const chGrid =
    document.getElementById("channelGrid");

  function setStatus(text, className) {
    statusEl.textContent = text;
    statusEl.className = className;
  }

  function setLive(on) {
    liveDot.className =
      "dot" + (on ? " live" : "");
  }

  function esc(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showLogin(
    message = "Enter the gateway password."
  ) {
    loadingPanel.classList.add("hidden");
    playerPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");

    loginMessage.textContent = message;
    passwordInput.value = "";
    setLive(false);

    window.setTimeout(() => {
      passwordInput.focus();
    }, 0);
  }

  function showPlayer() {
    loadingPanel.classList.add("hidden");
    loginPanel.classList.add("hidden");
    playerPanel.classList.remove("hidden");

    loginMessage.textContent = "";

    accessMode.textContent = protectedMode
      ? "🔒 Password protected"
      : "🔓 Open LAN access";

    logoutBtn.classList.toggle(
      "hidden",
      !protectedMode
    );
  }

  async function checkAuthentication() {
    try {
      const response = await fetch(
        "/api/auth/status",
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        }
      );

      const responseText = await response.text();

      if (!response.ok) {
        throw new Error(
          `Authentication endpoint returned HTTP ` +
          `${response.status}: ${responseText}`
        );
      }

      let result;

      try {
        result = JSON.parse(responseText);
      } catch {
        throw new Error(
          "Authentication endpoint returned invalid JSON."
        );
      }

      protectedMode = Boolean(result.protected);

      if (result.authenticated) {
        showPlayer();
        await fetchStreams();
      } else {
        showLogin();
      }
    } catch (error) {
      console.error(
        "OpenAudio authentication check failed:",
        error
      );

      loadingPanel.innerHTML = `
        <strong>
          Could not reach the OpenAudio gateway API.
        </strong>

        <div
          style="
            margin-top:0.6rem;
            color:#aaa;
            font-size:0.8rem;
          "
        >
          ${esc(error.message)}
        </div>

        <button
          id="retryGatewayBtn"
          type="button"
          style="margin-top:1rem;width:100%"
        >
          Retry
        </button>
      `;

      document
        .getElementById("retryGatewayBtn")
        .addEventListener("click", () => {
          location.reload();
        });
    }
  }

  loginForm.addEventListener(
    "submit",
    async event => {
      event.preventDefault();

      loginBtn.disabled = true;
      loginMessage.textContent = "Signing in…";

      try {
        const response = await fetch(
          "/api/login",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              password: passwordInput.value
            })
          }
        );

        const result = await response
          .json()
          .catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.message || "Login failed."
          );
        }

        protectedMode = Boolean(
          result.protected ?? true
        );

        showPlayer();

        setStatus(
          "Signed in. Select a stream above, then press Play.",
          "ok"
        );

        await fetchStreams();
      } catch (error) {
        loginMessage.textContent = error.message;
        passwordInput.select();
      } finally {
        loginBtn.disabled = false;
      }
    }
  );

  logoutBtn.addEventListener(
    "click",
    async () => {
      teardown();

      await fetch("/api/logout", {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store"
      }).catch(() => {});

      streams = [];
      selectedNodeId = null;
      playBtn.disabled = true;
      listEl.innerHTML = "";

      showLogin("You have been logged out.");
    }
  );

  async function handleExpiredSession() {
    teardown();
    streams = [];
    selectedNodeId = null;
    playBtn.disabled = true;

    showLogin(
      "Your session expired. Sign in again."
    );
  }

  // Original stream list with authenticated requests.
  async function fetchStreams() {
    listEl.innerHTML =
      '<div class="empty">Loading…</div>';

    try {
      const response = await fetch(
        "/api/streams",
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        }
      );

      if (response.status === 401) {
        await handleExpiredSession();
        return;
      }

      if (!response.ok) {
        throw new Error(
          `Could not reach /api/streams: ` +
          `HTTP ${response.status}`
        );
      }

      const result = await response.json();
      streams = Array.isArray(result) ? result : [];

      if (
        selectedNodeId &&
        !streams.some(
          stream =>
            stream.nodeId === selectedNodeId
        )
      ) {
        selectedNodeId = null;
      }

      renderList();
    } catch (error) {
      listEl.innerHTML =
        '<div class="empty">' +
        "Could not reach /api/streams" +
        "</div>";

      setStatus(error.message, "err");
    }
  }

  function renderList() {
    if (!streams.length) {
      listEl.innerHTML =
        '<div class="empty">' +
        "No streams discovered yet — " +
        "is a publisher running?" +
        "</div>";

      playBtn.disabled = true;
      return;
    }

    listEl.innerHTML = "";

    streams.forEach(stream => {
      const element =
        document.createElement("div");

      element.className =
        "stream-card" +
        (
          stream.nodeId === selectedNodeId
            ? " selected"
            : ""
        );

      element.innerHTML = `
        <div>
          <div class="name">
            ${esc(stream.streamName)}
          </div>

          <div class="meta">
            ${esc(stream.nodeName)} ·
            ${Number(stream.channelCount)}ch ·
            ${esc(stream.ip)}
          </div>
        </div>

        <span class="arrow">▶</span>
      `;

      element.addEventListener(
        "click",
        () => {
          selectedNodeId = stream.nodeId;
          renderList();
          playBtn.disabled = false;
        }
      );

      listEl.appendChild(element);
    });

    playBtn.disabled =
      selectedNodeId === null;
  }

  // Original channel grid.
  function buildChannelGrid(channelTotal, labels = []) {
    chGrid.innerHTML = "";
    channelLabels = labels;

    activeChannels = new Set(
      Array.from(
        { length: channelTotal },
        (_, index) => index
      )
    );

    for (
      let index = 0;
      index < channelTotal;
      index++
    ) {
      const button =
        document.createElement("div");

      button.className = "ch-btn active";
      button.dataset.ch = index;

      const side =
        channelTotal > 1
          ? (index % 2 === 0 ? "L" : "R")
          : "M";

      const pair =
        Math.floor(index / 2) + 1;

      button.innerHTML = `
        <span class="ch-num">
          ${index + 1}
        </span>

        <span class="ch-label">
          ${channelLabels[index] || (channelTotal <= 2 ? side : pair + side)}
        </span>
      `;

      button.addEventListener(
        "click",
        () => toggleChannel(index, button)
      );

      chGrid.appendChild(button);
    }

    chSection.style.display = "block";
  }

  function toggleChannel(index, button) {
    if (activeChannels.has(index)) {
      activeChannels.delete(index);
      button.classList.remove("active");
    } else {
      activeChannels.add(index);
      button.classList.add("active");
    }

    updateChannelBadge();
  }

  function selectAll() {
    for (
      let index = 0;
      index < totalChannels;
      index++
    ) {
      activeChannels.add(index);
    }

    chGrid
      .querySelectorAll(".ch-btn")
      .forEach(button => {
        button.classList.add("active");
      });

    updateChannelBadge();
  }

  function selectNone() {
    activeChannels.clear();

    chGrid
      .querySelectorAll(".ch-btn")
      .forEach(button => {
        button.classList.remove("active");
      });

    updateChannelBadge();
  }

  function selectPairs(mode) {
    activeChannels.clear();

    chGrid
      .querySelectorAll(".ch-btn")
      .forEach((button, index) => {
        const keep =
          mode === "L"
            ? index % 2 === 0
            : mode === "R"
              ? index % 2 === 1
              : true;

        if (keep) {
          activeChannels.add(index);
          button.classList.add("active");
        } else {
          button.classList.remove("active");
        }
      });

    updateChannelBadge();
  }

  function setMix(element) {
    document
      .querySelectorAll(".mix-btn")
      .forEach(button => {
        button.classList.remove("active");
      });

    element.classList.add("active");
    mixMode = element.dataset.mix;
  }

  function updateChannelBadge() {
    const sorted = [...activeChannels]
      .sort((left, right) => left - right)
      .map(index => index + 1);

    document
      .getElementById("npChannels")
      .textContent =
        sorted.length === totalChannels
          ? "All channels"
          : sorted.length === 0
            ? "Muted"
            : "Ch " + sorted.join(", ");
  }

  document
    .getElementById("chSelectAll")
    .addEventListener("click", selectAll);

  // Original downmix implementation.
  function downmixToStereo(interleaved) {
    const frames =
      interleaved.length / totalChannels;

    const output =
      new Float32Array(frames * 2);

    const selected =
      [...activeChannels].sort(
        (left, right) => left - right
      );

    if (selected.length === 0) {
      return output;
    }

    if (mixMode === "first2") {
      const channelLeft = selected[0];

      const channelRight =
        selected.length > 1
          ? selected[1]
          : selected[0];

      for (
        let frame = 0;
        frame < frames;
        frame++
      ) {
        output[frame * 2] =
          interleaved[
            frame * totalChannels +
            channelLeft
          ];

        output[frame * 2 + 1] =
          interleaved[
            frame * totalChannels +
            channelRight
          ];
      }

      return output;
    }

    if (mixMode === "mono") {
      const gain = 1 / selected.length;

      for (
        let frame = 0;
        frame < frames;
        frame++
      ) {
        let sum = 0;

        for (const channel of selected) {
          sum += interleaved[
            frame * totalChannels + channel
          ];
        }

        const value = sum * gain;
        output[frame * 2] = value;
        output[frame * 2 + 1] = value;
      }

      return output;
    }

    const leftChannels =
      selected.filter(
        index => index % 2 === 0
      );

    const rightChannels =
      selected.filter(
        index => index % 2 === 1
      );

    const leftSources =
      leftChannels.length
        ? leftChannels
        : selected;

    const rightSources =
      rightChannels.length
        ? rightChannels
        : selected;

    const leftGain =
      1 / leftSources.length;

    const rightGain =
      1 / rightSources.length;

    for (
      let frame = 0;
      frame < frames;
      frame++
    ) {
      let left = 0;
      let right = 0;

      for (const channel of leftSources) {
        left += interleaved[
          frame * totalChannels + channel
        ];
      }

      for (const channel of rightSources) {
        right += interleaved[
          frame * totalChannels + channel
        ];
      }

      output[frame * 2] =
        left * leftGain;

      output[frame * 2 + 1] =
        right * rightGain;
    }

    return output;
  }

  // Original AudioWorklet engine.
  const WORKLET_CODE = `
    class PCMPlayerProcessor extends AudioWorkletProcessor {
      constructor(options) {
        super();

        const {
          capacitySamples,
          prebufferSeconds,
          sampleRate
        } = options.processorOptions;

        this.capacity = capacitySamples;
        this.bufL = new Float32Array(this.capacity);
        this.bufR = new Float32Array(this.capacity);
        this.writeIndex = 0;
        this.readIndex = 0;
        this.available = 0;
        this.started = false;

        this.prebufferSamples = Math.floor(
          sampleRate * prebufferSeconds
        );
        this.minimumPrebufferSamples = Math.floor(
          sampleRate * 0.08
        );
        this.maximumPrebufferSamples = Math.floor(
          sampleRate * 0.5
        );

        this.underrunCount = 0;
        this.lastReportedUnderruns = 0;
        this.statsCounter = 0;

        this.port.onmessage = event => {
          if (event.data.type === "data") {
            this._write(
              event.data.l,
              event.data.r
            );
          }
        };
      }

      _write(left, right) {
        for (
          let index = 0;
          index < left.length;
          index++
        ) {
          this.bufL[this.writeIndex] =
            left[index];

          this.bufR[this.writeIndex] =
            right[index];

          this.writeIndex =
            (this.writeIndex + 1) %
            this.capacity;

          if (
            this.available < this.capacity
          ) {
            this.available++;
          } else {
            this.readIndex =
              (this.readIndex + 1) %
              this.capacity;
          }
        }
      }

      process(inputs, outputs) {
        const outputLeft =
          outputs[0][0];

        const outputRight =
          outputs[0][1] || outputs[0][0];

        const needed = outputLeft.length;

        if (++this.statsCounter >= 20) {
          this.statsCounter = 0;

          if (this.underrunCount > this.lastReportedUnderruns) {
            this.prebufferSamples = Math.min(
              this.maximumPrebufferSamples,
              Math.floor(this.prebufferSamples * 1.15)
            );
          } else {
            this.prebufferSamples = Math.max(
              this.minimumPrebufferSamples,
              Math.floor(this.prebufferSamples * 0.995)
            );
          }
          this.lastReportedUnderruns = this.underrunCount;

          this.port.postMessage({
            type: "stats",
            available: this.available,
            underruns: this.underrunCount,
            target: this.prebufferSamples
          });
        }

        if (!this.started) {
          if (
            this.available >=
            this.prebufferSamples
          ) {
            this.started = true;
          } else {
            outputLeft.fill(0);
            outputRight.fill(0);
            return true;
          }
        }

        if (this.available < needed) {
          this.underrunCount++;
          outputLeft.fill(0);
          outputRight.fill(0);

          this.started =
            this.available >=
            this.prebufferSamples;

          return true;
        }

        for (
          let frame = 0;
          frame < needed;
          frame++
        ) {
          outputLeft[frame] =
            this.bufL[this.readIndex];

          outputRight[frame] =
            this.bufR[this.readIndex];

          this.readIndex =
            (this.readIndex + 1) %
            this.capacity;

          this.available--;
        }

        return true;
      }
    }

    registerProcessor(
      "pcm-player",
      PCMPlayerProcessor
    );
  `;

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      audioCtx = new AudioContextClass();
    }

    audioCtx.resume().catch(() => {});
  }

  async function setupPlaybackEngine() {
    const canWorklet =
      window.isSecureContext &&
      audioCtx.audioWorklet;

    if (canWorklet) {
      try {
        const blob = new Blob(
          [WORKLET_CODE],
          {
            type: "application/javascript"
          }
        );

        const moduleUrl =
          URL.createObjectURL(blob);

        try {
          await audioCtx.audioWorklet
            .addModule(moduleUrl);
        } finally {
          URL.revokeObjectURL(moduleUrl);
        }

        workletNode =
          new AudioWorkletNode(
            audioCtx,
            "pcm-player",
            {
              numberOfInputs: 0,
              numberOfOutputs: 1,
              outputChannelCount: [2],
              processorOptions: {
                sampleRate,
                capacitySamples:
                  audioCtx.sampleRate * 2,
                prebufferSeconds: 0.15
              }
            }
          );

        workletNode.port.onmessage =
          event => {
            if (
              event.data.type === "stats"
            ) {
              const milliseconds =
                (
                  event.data.available /
                  audioCtx.sampleRate *
                  1000
                ).toFixed(0);

              statsEl.textContent =
                `Buffered: ${milliseconds}ms · ` +
                `Underruns: ` +
                `${event.data.underruns} · ` +
                `Target: ${(event.data.target / audioCtx.sampleRate * 1000).toFixed(0)}ms`;
            }
          };

        workletNode.connect(
          audioCtx.destination
        );

        usingWorklet = true;
        return;
      } catch (error) {
        console.warn(
          "AudioWorklet failed, falling back:",
          error
        );
      }
    }

    ringCapacity =
      audioCtx.sampleRate * 2;

    ringBuffers = [
      new Float32Array(ringCapacity),
      new Float32Array(ringCapacity)
    ];

    ringWrite = 0;
    ringRead = 0;
    ringAvailable = 0;
    fallbackUnderruns = 0;

    let prebuffer = Math.floor(
      audioCtx.sampleRate * 0.15
    );
    let stableCallbacks = 0;

    let started = false;

    processorNode =
      audioCtx.createScriptProcessor(
        2048,
        0,
        2
      );

    processorNode.onaudioprocess =
      event => {
        const outputLeft =
          event.outputBuffer
            .getChannelData(0);

        const outputRight =
          event.outputBuffer
            .getChannelData(1);

        const needed =
          outputLeft.length;

        if (!started) {
          if (
            ringAvailable >= prebuffer
          ) {
            started = true;
          } else {
            outputLeft.fill(0);
            outputRight.fill(0);
            return;
          }
        }

        if (ringAvailable < needed) {
          fallbackUnderruns++;
          prebuffer = Math.min(
            audioCtx.sampleRate * 0.5,
            Math.floor(prebuffer * 1.15)
          );
          stableCallbacks = 0;
          outputLeft.fill(0);
          outputRight.fill(0);

          started =
            ringAvailable >= prebuffer;

          return;
        }

        stableCallbacks++;
        if (stableCallbacks >= 200) {
          prebuffer = Math.max(
            audioCtx.sampleRate * 0.08,
            Math.floor(prebuffer * 0.995)
          );
          stableCallbacks = 0;
        }

        for (
          let frame = 0;
          frame < needed;
          frame++
        ) {
          outputLeft[frame] =
            ringBuffers[0][ringRead];

          outputRight[frame] =
            ringBuffers[1][ringRead];

          ringRead =
            (ringRead + 1) %
            ringCapacity;

          ringAvailable--;
        }

        statsEl.textContent =
          `Buffered: ` +
          `${(
            ringAvailable /
            audioCtx.sampleRate *
            1000
          ).toFixed(0)}ms · ` +
          `Underruns: ${fallbackUnderruns} · ` +
          `Target: ${(prebuffer / audioCtx.sampleRate * 1000).toFixed(0)}ms`;
      };

    processorNode.connect(
      audioCtx.destination
    );

    usingWorklet = false;
  }

  // Original incoming PCM handling.
  function handleBinaryChunk(buffer) {
    const raw =
      new Float32Array(buffer);

    const stereo =
      downmixToStereo(raw);

    const frames =
      stereo.length / 2;

    if (
      usingWorklet &&
      workletNode
    ) {
      const left =
        new Float32Array(frames);

      const right =
        new Float32Array(frames);

      for (
        let frame = 0;
        frame < frames;
        frame++
      ) {
        left[frame] =
          stereo[frame * 2];

        right[frame] =
          stereo[frame * 2 + 1];
      }

      workletNode.port.postMessage(
        {
          type: "data",
          l: left,
          r: right
        },
        [left.buffer, right.buffer]
      );
    } else if (
      processorNode &&
      ringBuffers.length === 2 &&
      ringCapacity > 0
    ) {
      for (
        let frame = 0;
        frame < frames;
        frame++
      ) {
        ringBuffers[0][ringWrite] =
          stereo[frame * 2];

        ringBuffers[1][ringWrite] =
          stereo[frame * 2 + 1];

        ringWrite =
          (ringWrite + 1) %
          ringCapacity;

        if (
          ringAvailable < ringCapacity
        ) {
          ringAvailable++;
        } else {
          ringRead =
            (ringRead + 1) %
            ringCapacity;
        }
      }
    }
  }

  function teardown() {
    if (ws) {
      ws.onopen = null;
      ws.onmessage = null;
      ws.onerror = null;
      ws.onclose = null;

      if (
        ws.readyState ===
          WebSocket.OPEN ||
        ws.readyState ===
          WebSocket.CONNECTING
      ) {
        ws.close(1000, "Player stopped");
      }

      ws = null;
    }

    if (workletNode) {
      workletNode.disconnect();
      workletNode.port.onmessage = null;
      workletNode = null;
    }

    if (processorNode) {
      processorNode.onaudioprocess = null;
      processorNode.disconnect();
      processorNode = null;
    }

    usingWorklet = false;
    ringBuffers = [];
    ringCapacity = 0;
    ringAvailable = 0;

    setLive(false);
    statsEl.textContent = "";
    nowPlaying.style.display = "none";
    resumeBtn.classList.remove("show");
    chSection.style.display = "none";
  }

  playBtn.addEventListener(
    "click",
    () => {
      if (!selectedNodeId) {
        return;
      }

      teardown();
      ensureAudioContext();

      const websocketProtocol =
        location.protocol === "https:"
          ? "wss"
          : "ws";

      const websocketUrl =
        `${websocketProtocol}://` +
        `${location.hostname}:${WS_PORT}`;

      setStatus(
        "Connecting…",
        "idle"
      );

      ws = new WebSocket(websocketUrl);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "select",
          nodeId: selectedNodeId
        }));

        setStatus(
          "Connected — waiting for audio…",
          "idle"
        );
      };

      ws.onmessage = async event => {
        try {
          if (
            typeof event.data === "string"
          ) {
            const message =
              JSON.parse(event.data);

            if (message.type === "format") {
              totalChannels =
                Number(message.channels);

              channelLabels = Array.isArray(message.channelLabels)
                ? message.channelLabels
                : [];

              sampleRate =
                Number(message.sampleRate);

              streamDisplayName =
                message.streamName ||
                selectedNodeId;

              if (
                !Number.isInteger(
                  totalChannels
                ) ||
                totalChannels < 1 ||
                totalChannels > 255
              ) {
                throw new Error(
                  "Invalid channel count."
                );
              }

              if (
                !Number.isFinite(sampleRate) ||
                sampleRate <= 0
              ) {
                throw new Error(
                  "Invalid sample rate."
                );
              }

              if (audioCtx && audioCtx.sampleRate !== sampleRate) {
                audioCtx.close().catch(() => {});
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass({ sampleRate });
                await audioCtx.resume().catch(() => {});
              }

              buildChannelGrid(
                totalChannels,
                channelLabels
              );

              await setupPlaybackEngine();

              nowPlaying.style.display =
                "block";

              document
                .getElementById("npName")
                .textContent =
                  streamDisplayName;

              document
                .getElementById("npFormat")
                .textContent =
                  `${totalChannels}ch @ ` +
                  `${sampleRate}Hz`;

              document
                .getElementById("npEngine")
                .textContent =
                  usingWorklet
                    ? "AudioWorklet"
                    : "Fallback";

              updateChannelBadge();

              if (
                audioCtx.state === "running"
              ) {
                setStatus(
                  `Playing: ` +
                  `${streamDisplayName}`,
                  "ok"
                );

                setLive(true);

                resumeBtn.classList
                  .remove("show");
              } else {
                setStatus(
                  "Audio suspended — " +
                  "click the button below.",
                  "warn-st"
                );

                resumeBtn.classList
                  .add("show");
              }
            } else if (
              message.type === "error"
            ) {
              setStatus(
                `Server: ${message.message}`,
                "err"
              );
            }
          } else {
            handleBinaryChunk(
              event.data
            );
          }
        } catch (error) {
          setStatus(
            `Error: ${error.message}`,
            "err"
          );

          console.error(error);
        }
      };

      ws.onerror = () => {
        setStatus(
          protectedMode
            ? "WebSocket authentication or " +
              "connection failed. Your session " +
              "may have expired."
            : "WebSocket error.",
          "err"
        );

        setLive(false);
      };

      ws.onclose = event => {
        setLive(false);

        if (event.code !== 1000) {
          setStatus(
            protectedMode
              ? "Disconnected. Your session may " +
                "have expired."
              : "Disconnected.",
            "err"
          );
        }
      };
    }
  );

  resumeBtn.addEventListener(
    "click",
    async () => {
      ensureAudioContext();

      try {
        await audioCtx.resume();
      } catch (error) {
        setStatus(
          `Could not enable audio: ` +
          `${error.message}`,
          "err"
        );

        return;
      }

      if (
        audioCtx.state === "running"
      ) {
        setStatus(
          `Playing: ${streamDisplayName}`,
          "ok"
        );

        setLive(true);

        resumeBtn.classList
          .remove("show");
      }
    }
  );

  refreshBtn.addEventListener(
    "click",
    fetchStreams
  );

  checkAuthentication();
</script>
</body>
</html>
