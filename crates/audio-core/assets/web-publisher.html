<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAudio by Ferronme — Mic Publisher</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #131c2e;
            --surface-accent: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge.secure { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: var(--success); }
        .badge.insecure { background: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: var(--warning); }
        
        .field { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .meter-container {
            margin: 1.25rem 0;
            background: var(--bg);
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }
        .meter-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }
        canvas {
            width: 100%;
            height: 18px;
            display: block;
            border-radius: 3px;
            background: #0b1120;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
        }
        .gain-val {
            font-size: 0.85rem;
            min-width: 45px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        button {
            padding: 0.9rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.15s ease;
        }
        button:hover { background-color: var(--primary-hover); }
        button.stop { background-color: var(--danger); }
        button.stop:hover { background-color: var(--danger-hover); }
        
        .mute-btn {
            background-color: var(--surface-accent);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0 1.2rem;
            font-size: 1.1rem;
        }
        .mute-btn.muted {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .stats-card {
            margin-top: 1.25rem;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        .status-text { margin-top: 0.75rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ OpenAudio by Ferronme</h1>
            <div id="securityBadge" class="badge">Checking...</div>
        </div>

        <div class="field">
            <label for="streamName">Stream Name</label>
            <input type="text" id="streamName" value="Mobile Mic" placeholder="e.g. Host Vocal">
        </div>

        <div class="field">
            <label for="codecSelect">Audio Format & Bandwidth</label>
            <select id="codecSelect">
                <option value="opus-32">Opus Voice (32 kbps — Ultra Low Bandwidth)</option>
                <option value="opus-64" selected>Opus Standard (64 kbps — Recommended)</option>
                <option value="opus-128">Opus Studio (128 kbps — Broadcast Quality)</option>
                <option value="pcm-f32">Uncompressed PCM (1.5 Mbps — Raw Float32)</option>
            </select>
        </div>

        <div class="field">
            <div class="meter-header">
                <label for="gainSlider" style="margin-bottom:0">Mic Gain</label>
                <span class="gain-val" id="gainDisplay">0.0 dB</span>
            </div>
            <div class="slider-row">
                <input type="range" id="gainSlider" min="0" max="24" value="0" step="0.5">
            </div>
        </div>

        <div class="meter-container">
            <div class="meter-header">
                <span>Input Level</span>
                <span id="meterDb">-∞ dB</span>
            </div>
            <canvas id="vuMeter" width="360" height="18"></canvas>
        </div>

        <div class="btn-grid">
            <button id="toggleBtn">Start Publishing</button>
            <button id="muteBtn" class="mute-btn" title="Mute Microphone">🎤</button>
        </div>

        <div class="stats-card" id="statsCard" style="display:none">
            <span id="rateStat">Bandwidth: 0 kbps</span>
            <span id="packetsStat">Packets: 0</span>
        </div>

        <div class="status-text" id="statusText">Ready to connect.</div>
    </div>

    <script>
        const isSecure = window.isSecureContext;
        const securityBadge = document.getElementById('securityBadge');
        if (isSecure) {
            securityBadge.innerText = '🔒 Secure HTTPS';
            securityBadge.className = 'badge secure';
        } else {
            securityBadge.innerText = '⚠️ Insecure HTTP';
            securityBadge.className = 'badge insecure';
            securityBadge.title = 'Microphone access may be restricted by your browser. Use HTTPS if connection fails.';
        }

        let isPublishing = false;
        let isMuted = false;
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let gainNode = null;
        let analyserNode = null;
        let workletNode = null;
        let audioEncoder = null;
        let pcmProcessor = null;
        let animFrameId = null;

        let peakHold = 0;
        let bytesSentInterval = 0;
        let totalPackets = 0;
        let statsInterval = null;

        const toggleBtn = document.getElementById('toggleBtn');
        const muteBtn = document.getElementById('muteBtn');
        const statusText = document.getElementById('statusText');
        const nameInput = document.getElementById('streamName');
        const codecSelect = document.getElementById('codecSelect');
        const gainSlider = document.getElementById('gainSlider');
        const gainDisplay = document.getElementById('gainDisplay');
        const meterDb = document.getElementById('meterDb');
        const vuCanvas = document.getElementById('vuMeter');
        const vuCtx = vuCanvas.getContext('2d');
        const statsCard = document.getElementById('statsCard');
        const rateStat = document.getElementById('rateStat');
        const packetsStat = document.getElementById('packetsStat');

        // Check WebCodecs Opus support
        const hasWebCodecs = typeof window.AudioEncoder !== 'undefined';
        if (!hasWebCodecs) {
            console.warn("WebCodecs AudioEncoder not available; falling back to PCM mode.");
            codecSelect.value = "pcm-f32";
            const opusOptions = codecSelect.querySelectorAll('option[value^="opus"]');
            opusOptions.forEach(opt => opt.text += ' (Unsupported in this browser)');
        }

        gainSlider.addEventListener('input', (e) => {
            const db = parseFloat(e.target.value);
            gainDisplay.innerText = `${db >= 0 ? '+' : ''}${db.toFixed(1)} dB`;
            if (gainNode) {
                const linearGain = Math.pow(10, db / 20);
                gainNode.gain.setTargetAtTime(linearGain, audioContext.currentTime, 0.02);
            }
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.classList.add('muted');
                muteBtn.innerText = '🔇';
                if (gainNode) gainNode.gain.setTargetAtTime(0, audioContext.currentTime, 0.01);
            } else {
                muteBtn.classList.remove('muted');
                muteBtn.innerText = '🎤';
                const db = parseFloat(gainSlider.value);
                const linearGain = Math.pow(10, db / 20);
                if (gainNode) gainNode.gain.setTargetAtTime(linearGain, audioContext.currentTime, 0.01);
            }
        });

        toggleBtn.addEventListener('click', async () => {
            if (isPublishing) {
                stopPublishing();
            } else {
                await startPublishing();
            }
        });

        function renderMeter() {
            if (!analyserNode) {
                vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
                return;
            }

            const buffer = new Float32Array(analyserNode.fftSize);
            analyserNode.getFloatTimeDomainData(buffer);

            let peak = 0;
            for (let i = 0; i < buffer.length; i++) {
                const abs = Math.abs(buffer[i]);
                if (abs > peak) peak = abs;
            }

            let db = -Infinity;
            if (peak > 0.00001) {
                db = 20 * Math.log10(peak);
            }

            if (db > peakHold) {
                peakHold = db;
            } else {
                peakHold -= 0.6; // smooth decay
            }

            meterDb.innerText = isMuted ? "MUTED" : (db > -48 ? `${db.toFixed(1)} dB` : "-∞ dB");

            vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);

            // Normalized level between -48 dB (0%) and 0 dB (100%)
            const norm = Math.max(0, Math.min(1, (db + 48) / 48));
            const fillWidth = norm * vuCanvas.width;

            // Gradient: Green -> Yellow -> Red
            const grad = vuCtx.createLinearGradient(0, 0, vuCanvas.width, 0);
            grad.addColorStop(0, '#10b981');
            grad.addColorStop(0.7, '#f59e0b');
            grad.addColorStop(0.92, '#ef4444');

            vuCtx.fillStyle = grad;
            vuCtx.fillRect(0, 0, fillWidth, vuCanvas.height);

            // Peak Hold line
            const normPeak = Math.max(0, Math.min(1, (peakHold + 48) / 48));
            const peakX = normPeak * vuCanvas.width;
            if (peakX > 0) {
                vuCtx.fillStyle = '#ffffff';
                vuCtx.fillRect(Math.max(0, peakX - 2), 0, 2, vuCanvas.height);
            }

            animFrameId = requestAnimationFrame(renderMeter);
        }

        async function startPublishing() {
            try {
                statusText.innerText = "Requesting microphone permission...";
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 48000
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const source = audioContext.createMediaStreamSource(mediaStream);
                gainNode = audioContext.createGain();
                const db = parseFloat(gainSlider.value);
                gainNode.gain.value = Math.pow(10, db / 20);

                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 256;

                source.connect(gainNode);
                gainNode.connect(analyserNode);

                const sampleRate = audioContext.sampleRate || 48000;
                const channels = 1;

                const selectedMode = codecSelect.value;
                const isOpus = selectedMode.startsWith('opus') && hasWebCodecs;
                let targetBitrate = 64000;
                if (selectedMode === 'opus-32') targetBitrate = 32000;
                if (selectedMode === 'opus-128') targetBitrate = 128000;

                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsPort = parseInt(window.location.port) + 1;
                const wsUrl = `${wsProtocol}//${window.location.hostname}:${wsPort}/publish-ws`;

                statusText.innerText = `Connecting WebSocket to ${wsUrl}...`;
                ws = new WebSocket(wsUrl);
                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    const handshake = {
                        type: "publish",
                        streamName: nameInput.value.trim() || "Mobile Mic",
                        channels: channels,
                        sampleRate: sampleRate,
                        codec: isOpus ? "opus" : "pcm"
                    };
                    ws.send(JSON.stringify(handshake));

                    const codecName = isOpus ? `Opus (${targetBitrate / 1000} kbps)` : "Float32 PCM (1.5 Mbps)";
                    statusText.innerText = `🔴 Live: ${codecName} @ ${sampleRate} Hz`;
                    toggleBtn.innerText = "Stop Publishing";
                    toggleBtn.className = "stop";
                    statsCard.style.display = "flex";
                    isPublishing = true;
                    bytesSentInterval = 0;
                    totalPackets = 0;

                    statsInterval = setInterval(() => {
                        const kbps = ((bytesSentInterval * 8) / 1000).toFixed(1);
                        rateStat.innerText = `Bandwidth: ${kbps} kbps`;
                        packetsStat.innerText = `Packets: ${totalPackets}`;
                        bytesSentInterval = 0;
                    }, 1000);
                };

                ws.onerror = (e) => {
                    console.error("WS error:", e);
                    statusText.innerText = "WebSocket connection failed.";
                    stopPublishing();
                };

                ws.onclose = () => {
                    stopPublishing();
                };

                if (isOpus) {
                    audioEncoder = new AudioEncoder({
                        output: (chunk) => {
                            if (!isPublishing || !ws || ws.readyState !== WebSocket.OPEN) return;
                            const buf = new Uint8Array(chunk.byteLength);
                            chunk.copyTo(buf);
                            ws.send(buf);
                            bytesSentInterval += buf.byteLength;
                            totalPackets++;
                        },
                        error: (e) => console.error("AudioEncoder error:", e)
                    });

                    audioEncoder.configure({
                        codec: 'opus',
                        sampleRate: 48000,
                        numberOfChannels: 1,
                        bitrate: targetBitrate,
                    });

                    // Modern inline AudioWorklet
                    const workletCode = `
                        class MicCaptureProcessor extends AudioWorkletProcessor {
                            constructor() {
                                super();
                                this.buffer = new Float32Array(480); // 10ms frame @ 48kHz
                                this.idx = 0;
                            }
                            process(inputs) {
                                const input = inputs[0];
                                if (!input || !input[0]) return true;
                                const channel = input[0];
                                for (let i = 0; i < channel.length; i++) {
                                    this.buffer[this.idx++] = channel[i];
                                    if (this.idx === 480) {
                                        this.port.postMessage(this.buffer);
                                        this.buffer = new Float32Array(480);
                                        this.idx = 0;
                                    }
                                }
                                return true;
                            }
                        }
                        registerProcessor('mic-capture-processor', MicCaptureProcessor);
                    `;
                    const blob = new Blob([workletCode], { type: 'application/javascript' });
                    const workletUrl = URL.createObjectURL(blob);
                    await audioContext.audioWorklet.addModule(workletUrl);
                    URL.revokeObjectURL(workletUrl);

                    workletNode = new AudioWorkletNode(audioContext, 'mic-capture-processor');
                    let frameTimestamp = 0;

                    workletNode.port.onmessage = (e) => {
                        if (!isPublishing || audioEncoder.state !== "configured") return;
                        const frameData = e.data;
                        const audioData = new AudioData({
                            format: 'f32',
                            sampleRate: 48000,
                            numberOfFrames: 480,
                            numberOfChannels: 1,
                            timestamp: frameTimestamp,
                            data: frameData
                        });
                        frameTimestamp += 10000; // 10ms in microseconds
                        audioEncoder.encode(audioData);
                        audioData.close();
                    };

                    gainNode.connect(workletNode);
                } else {
                    // Fallback PCM processor
                    pcmProcessor = audioContext.createScriptProcessor(2048, 1, 1);
                    pcmProcessor.onaudioprocess = (e) => {
                        if (!isPublishing || !ws || ws.readyState !== WebSocket.OPEN) return;
                        const inputData = e.inputBuffer.getChannelData(0);
                        const copy = new Float32Array(inputData);
                        ws.send(copy.buffer);
                        bytesSentInterval += copy.byteLength;
                        totalPackets++;
                    };
                    gainNode.connect(pcmProcessor);
                    pcmProcessor.connect(audioContext.destination);
                }

                renderMeter();

            } catch (err) {
                console.error("Publishing error:", err);
                statusText.innerText = `Error: ${err.message || 'Could not access mic'}`;
                stopPublishing();
            }
        }

        function stopPublishing() {
            isPublishing = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (statsInterval) clearInterval(statsInterval);
            if (workletNode) { workletNode.disconnect(); workletNode = null; }
            if (pcmProcessor) { pcmProcessor.disconnect(); pcmProcessor = null; }
            if (audioEncoder && audioEncoder.state !== "closed") {
                audioEncoder.close();
                audioEncoder = null;
            }
            if (gainNode) { gainNode.disconnect(); gainNode = null; }
            if (analyserNode) { analyserNode.disconnect(); analyserNode = null; }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close();
                audioContext = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }

            toggleBtn.innerText = "Start Publishing";
            toggleBtn.className = "";
            statsCard.style.display = "none";
            meterDb.innerText = "-∞ dB";
            vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
            statusText.innerText = "Publishing stopped.";
        }
    </script>
</body>
</html>
